<!-- templates/base/base.html -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    {% load static %}
    <title>{% block title %}Merchero Enterprises{% endblock %}</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/main.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=DM+Sans:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    {% block extra_css %}{% endblock %}
</head>

<body>
    {% include 'base/navbar.html' %}

    <main>
        {% block content %}{% endblock %}
    </main>
    <!-- Back to Top Button -->
    <button id="back-to-top" class="back-to-top"><i class="fas fa-arrow-up"></i></button>
    {% include 'base/footer.html' %}
    {% block extra_js %}{% endblock %}
    <script type="module" src="/static/js/main.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</body>

</html>
